<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found" i]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <title>Story page</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,300;7..72,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
    />
    <style>
      :root {
        --bg: #15100e;
        --panel: #1b1412;
        --line: #2f2420;
        --fg: #f6ece2;
        --soft: #d9cbbf;
        --muted: #9c8a7f;
        --hover: #2a201c;
        --flame: #e2583a;
        --gold: #efd08a;
        --gold-soft: #3a2c1c;
        --green: #7fd08a;
        --red: #e2583a;
        --serif: "Literata", Georgia, "Times New Roman", serif;
        --sans:
          "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial,
          sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
        color-scheme: dark;
      }
      html,
      body {
        background-color: var(--bg);
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.45;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 20px 40px;
      }
      .wrap {
        max-width: 1280px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
      }
      @media (min-width: 860px) {
        .stage {
          --vh: 64vh;
          --vvh: min(70vh, 820px);
        }
        .wrap {
          grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr);
          gap: 28px;
          align-items: start;
        }
      }
      .head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px 16px;
        align-items: start;
        margin-bottom: 10px;
        max-width: 1280px;
        margin-inline: auto;
      }
      h1 {
        font-family: var(--serif);
        font-weight: 300;
        font-size: clamp(24px, 3vw, 34px);
        letter-spacing: -0.01em;
        margin: 0;
        line-height: 1.1;
        text-wrap: balance;
      }
      .sub {
        color: var(--muted);
        font-size: 14px;
        margin: 6px 0 0;
      }
      .tools {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .ghost,
      .tabs button {
        appearance: none;
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
        border-radius: 8px;
        height: 36px;
        min-width: 36px;
        display: inline-grid;
        place-items: center;
        cursor: pointer;
        font: 600 12px/1 var(--sans);
        letter-spacing: 0.04em;
        padding: 0 10px;
        text-decoration: none;
        box-sizing: border-box;
      }
      .ghost {
        padding: 0 8px;
      }
      .ghost svg {
        width: 20px;
        height: 20px;
        display: block;
      }
      .ghost:hover,
      .tabs button:hover {
        background: var(--hover);
        color: var(--fg);
        border-color: var(--line);
      }
      .tabs {
        grid-column: 1 / -1;
        display: flex;
        gap: 16px;
        align-items: center;
      }
      /* Path: icon-only at the left; the bottom line runs only under the text tabs */
      .tabs .ovb {
        width: 38px;
        height: 32px;
        margin: 1px 0;
        min-width: 0;
        padding: 0;
        border: 0;
        border-radius: 8px;
        color: var(--muted);
        display: grid;
        place-items: center;
        flex: none;
      }
      .tabs .ovb svg {
        width: 18px;
        height: 18px;
      }
      .tabs .ovb[aria-pressed="true"] {
        background: color-mix(in srgb, #f0975a 16%, transparent);
        color: #f0975a;
        border-color: transparent;
      }
      .kinds {
        display: flex;
        flex: 1;
        min-width: 0;
        overflow-x: auto;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .kinds::-webkit-scrollbar {
        display: none;
      }
      .tabs .kinds button {
        flex: none;
      }
      .att::after {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--flame);
        margin-left: 6px;
        vertical-align: 2px;
      }
      #shortSeg {
        align-self: center;
        height: 32px;
      }
      .sheet {
        max-width: 560px;
        width: 100%;
        margin: 8px auto 0;
        display: grid;
        gap: 16px;
      }
      #script {
        max-width: 680px;
      }
      .sheet[hidden] {
        display: none;
      }
      .rows {
        list-style: none;
        margin: 0;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
      }
      .rows li {
        display: grid;
        grid-template-columns: 14px minmax(0, 1fr) auto;
        gap: 2px 12px;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
      }
      .rows li:last-child {
        border-bottom: 0;
      }
      .rows b {
        font-weight: 600;
      }
      .rows .mk {
        grid-column: 1;
        grid-row: 1 / span 2;
        display: grid;
        place-items: center;
        color: var(--green);
      }
      .rows .mk svg {
        width: 14px;
        height: 14px;
      }
      .rows b {
        grid-column: 2;
      }
      .rows small {
        grid-column: 2;
        color: var(--muted);
        font-size: 13px;
      }
      .rows .st {
        grid-column: 3;
        grid-row: 1 / span 2;
        width: 36px;
        height: 36px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        color: var(--muted);
      }
      .rows .st.check {
        color: var(--green);
      }
      .rows a.st.open {
        border: 1px solid #5a4840;
        color: var(--fg);
        text-decoration: none;
      }
      .rows a.st.open:hover {
        background: var(--hover);
        border-color: var(--soft);
      }
      .ghost.wide {
        justify-self: start;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        color: var(--fg);
      }
      /* Plain text tabs; the open one is underlined orange. Progress lives only on Path. */
      .tabs .kinds {
        gap: 20px;
        align-self: stretch;
        align-items: flex-end;
        border-bottom: 1px solid var(--line);
      }
      .tabs .kinds button {
        flex: none;
        border: 0;
        border-radius: 0;
        height: 34px;
        min-width: 0;
        padding: 0;
        background: transparent;
        font: 500 14px/1 var(--sans);
        letter-spacing: 0;
        color: var(--muted);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        white-space: nowrap;
      }
      .tabs .kinds button:hover {
        background: transparent;
        color: var(--fg);
      }
      .tabs .kinds button[aria-pressed="true"] {
        background: transparent;
        color: var(--fg);
        border-color: transparent;
        border-bottom-color: #f0975a;
      }
      .ttl {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 2px;
        gap: 2px;
        flex: none;
        height: 36px;
        box-sizing: border-box;
      }
      .seg button {
        appearance: none;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        padding: 0 10px;
        font: 600 12px/1 var(--sans);
        letter-spacing: 0.04em;
        cursor: pointer;
      }
      .seg button:hover {
        background: transparent;
        color: var(--fg);
      }
      .seg button[aria-pressed="true"] {
        background: color-mix(in srgb, #f0975a 16%, transparent);
        color: #f0975a;
      }
      .covers {
        display: grid;
        gap: 28px;
      }
      .covers[hidden] {
        display: none;
      }
      #crows {
        display: grid;
        gap: 36px;
      }
      .crow {
        display: grid;
        gap: 10px 20px;
        grid-template-columns: minmax(0, 1fr);
      }
      .crow h3 {
        margin: 0;
        font: 600 12px/1 var(--sans);
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      .crow img {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        border-radius: 12px;
        border: 1px solid var(--line);
        box-sizing: border-box;
        display: block;
      }
      .cnotes {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .cnotes .list li {
        grid-template-columns: minmax(0, 1fr) auto;
      }
      .cnotes .list .meta,
      .cnotes .list .reply {
        grid-column: 1;
      }
      .cnotes .row {
        justify-content: flex-end;
      }
      .cnotes .list {
        border-top: 0;
      }
      .cnotes .list:empty {
        display: none;
      }
      .cnotes .list li:last-child {
        border-bottom: 0;
      }
      @media (min-width: 800px) {
        .crow {
          grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr);
          align-items: start;
        }
        .crow h3 {
          grid-column: 1 / -1;
        }
      }
      .covers .ghost {
        justify-self: start;
        gap: 8px;
        display: inline-flex;
        align-items: center;
        padding: 0 12px;
      }
      .wrap.isCovers {
        max-width: 1100px;
      }
      .wrap.isWide {
        grid-template-columns: minmax(0, 1fr);
      }
      .wrap.isWide .side {
        display: none;
      }
      #path {
        --card: #1b1412;
        --ok: #7fd08a;
        --ink: var(--fg);
        max-width: 560px;
        margin: 8px auto 0;
        width: 100%;
        box-sizing: border-box;
        list-style: none;
        padding: 0;
        display: grid;
        gap: 18px;
        .flow {
          list-style: none;
          margin: 0;
          padding: 0;
          display: grid;
          gap: 18px;
        }
        .step {
          --tint: var(--muted);
          display: grid;
          grid-template-columns: 44px minmax(0, 1fr) 44px;
          align-items: center;
          column-gap: 14px;
          padding: 14px 16px;
          border-radius: 12px;
          border: 1px solid var(--line);
          position: relative;
          background: color-mix(in srgb, var(--tint) 7%, var(--card));
        }
        .step:not(:last-child)::after {
          content: "";
          position: absolute;
          left: 37px;
          top: 100%;
          height: 18px;
          border-left: 2px dashed var(--line);
        }
        .bot svg {
          width: 44px;
          height: 30px;
          display: block;
        }
        .mid {
          display: grid;
          gap: 4px;
        }
        .line {
          color: var(--muted);
          font-size: 13px;
          margin-bottom: 6px;
        }
        .step.wait .line {
          color: var(--tint);
        }
        .step.wait {
          border-color: color-mix(in srgb, var(--tint) 45%, transparent);
        }
        .name .ok {
          color: var(--ok);
          display: inline-grid;
        }
        .name .ok svg {
          width: 15px;
          height: 15px;
        }
        .prog {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 20px;
          gap: 10px;
          align-items: center;
        }
        .name {
          font-weight: 600;
          font-size: 16px;
          display: flex;
          justify-content: flex-start;
          gap: 6px;
          align-items: center;
        }
        .name b {
          font: 500 12px var(--sans);
          color: var(--muted);
          font-variant-numeric: tabular-nums;
        }
        .bar {
          height: 6px;
          border-radius: 3px;
          background: var(--line);
          overflow: hidden;
        }
        .bar i {
          display: block;
          height: 100%;
          background: var(--tint);
          border-radius: 3px;
        }
        .go {
          width: 44px;
          height: 44px;
          border-radius: 10px;
          border: 0;
          color: var(--soft);
          position: relative;
          display: grid;
          place-items: center;
          text-decoration: none;
          box-sizing: border-box;
        }
        .go:hover {
          background: var(--hover);
          border-color: var(--soft);
        }
        .go .ar {
          position: absolute;
          top: 3px;
          right: 3px;
          width: 10px;
          height: 10px;
          color: var(--muted);
        }
        .go:hover .ar,
        .step.wait .go .ar {
          color: inherit;
        }
        .mark {
          display: grid;
          place-items: center;
          color: var(--muted);
          width: 20px;
          height: 20px;
        }
        .mark svg {
          width: 18px;
          height: 18px;
        }
        .step.done .mark {
          color: var(--ok);
        }
        .step.wait .mark i,
        .step.work .mark i {
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background: var(--tint);
          display: block;
        }
        .step.wait .mark i {
          background: var(--tint);
          box-shadow: 0 0 0 4px color-mix(in srgb, var(--tint) 25%, transparent);
        }
        .step.todo {
          background: var(--card);
        }
        .step.todo .name {
          color: var(--muted);
          font-weight: 500;
        }
        @media (max-width: 420px) {
          .step {
            column-gap: 10px;
            padding: 12px;
          }
          .step:not(:last-child)::after {
            left: 33px;
          }
        }
      }
      #path[hidden] {
        display: none;
      }
      #path button.go {
        cursor: pointer;
        background: transparent;
        padding: 0;
        font: inherit;
      }
      #path .go svg,
      #path .mark svg {
        width: 20px;
        height: 20px;
        display: block;
      }
      @keyframes look {
        0%,
        30% {
          transform: translateX(0);
        }
        35%,
        55% {
          transform: translateX(-1px);
        }
        60%,
        85% {
          transform: translateX(1px);
        }
        90%,
        100% {
          transform: translateX(0);
        }
      }
      @keyframes blink {
        0%,
        44%,
        48%,
        94%,
        98%,
        100% {
          opacity: 1;
        }
        46%,
        96% {
          opacity: 0;
        }
      }
      .eyes.alive {
        animation: look 4s steps(1) infinite;
      }
      .eyes.alive .lid {
        animation: blink 4s steps(1) infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .eyes.alive,
        .eyes.alive .lid {
          animation: none;
        }
      }

      .tabs button[aria-pressed="true"] {
        background: var(--fg);
        color: var(--bg);
        border-color: var(--fg);
      }
      a:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      .stage {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .side {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      video.vert {
        aspect-ratio: 9 / 16;
      }
      .player:has(video.vert) {
        width: min(
          100%,
          calc(var(--vvh, clamp(260px, 100dvh - 440px, 760px)) * 9 / 16)
        );
      }
      video {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 12px;
        border: 1px solid var(--line);
        box-sizing: border-box;
        display: block;
        cursor: pointer;
      }
      .bar {
        position: relative;
        height: 28px;
      }
      .bar input {
        position: absolute;
        inset: 0;
        width: 100%;
        margin: 0;
        accent-color: var(--flame);
      }
      .marks {
        position: absolute;
        left: 8px;
        right: 8px;
        top: 0;
        height: 6px;
        pointer-events: none;
      }
      .marks i {
        position: absolute;
        top: 0;
        width: 6px;
        height: 6px;
        margin-left: -3px;
        border-radius: 50%;
        background: var(--gold);
      }
      .marks i.fixed {
        background: var(--green);
      }
      .ctl {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .ctl button {
        min-width: 44px;
        height: 36px;
        padding: 0 12px;
        font: 600 12px/1 var(--sans);
        letter-spacing: 0.04em;
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .ctl svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
        display: block;
      }
      button {
        font: inherit;
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 12px;
        cursor: pointer;
      }
      button:hover {
        background: var(--hover);
        color: var(--fg);
      }
      button:focus-visible,
      textarea:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      button.primary,
      .ctl button.primary {
        background: var(--fg);
        border-color: var(--fg);
        color: var(--bg);
        font-weight: 600;
      }
      button.primary:hover {
        background: var(--soft);
        color: var(--bg);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .tc {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        margin-left: auto;
        white-space: nowrap;
      }
      .compose {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
      }
      .compose:focus-within {
        border-color: var(--gold);
      }
      textarea {
        font: inherit;
        color: var(--fg);
        background: transparent;
        border: 0;
        padding: 10px 12px 4px;
        min-height: 72px;
        resize: none;
        field-sizing: content;
        max-height: 40vh;
        width: 100%;
        box-sizing: border-box;
      }
      textarea:focus-visible {
        outline: none;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 6px 8px 8px 12px;
      }
      .row b {
        font-family: var(--mono);
        color: var(--gold);
        font-weight: 500;
        font-size: 13px;
      }
      .row .state {
        flex: 1 1 60px;
        min-width: 0;
      }
      .row button {
        height: 34px;
        padding: 0 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }
      .row #save {
        margin-left: 0;
      }
      #mic {
        margin-left: auto;
        width: 40px;
        padding: 0;
      }
      .player {
        position: relative;
        width: min(
          100%,
          calc(var(--vh, clamp(200px, 100dvh - 420px, 700px)) * 16 / 9)
        );
        margin: 0 auto;
      }
      #mute {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 38px;
        height: 38px;
        padding: 0;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #fff;
      }
      #mute:hover {
        background: rgba(0, 0, 0, 0.75);
      }
      #mute svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
      .ctl .tc {
        margin-left: auto;
      }
      @media (max-width: 859px) {
        .ctl {
          justify-content: center;
        }
        .ctl .tc {
          margin-left: 0;
          flex-basis: 100%;
          text-align: center;
          order: -1;
        }
      }
      #mic[aria-pressed="true"] {
        border-color: var(--red);
        color: var(--red);
      }
      #fast[aria-pressed="true"],
      #fast2[aria-pressed="true"] {
        border-color: var(--gold);
        color: var(--gold);
      }
      .state {
        color: var(--muted);
        font-size: 13px;
        margin: 0;
      }
      .state.err {
        color: var(--red);
      }
      h2 {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 0;
      }
      .list {
        display: flex;
        flex-direction: column;
        margin: 0;
        padding: 0;
        list-style: none;
        border-top: 1px solid var(--line);
      }
      .list li {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 4px 12px;
        padding: 12px 0;

    <script>
      // Live data. Everything story-specific comes from this page's own db, written by the story
      // session with ArtifactData (docs/content-calendar/README.md "Story page data"):
      //   story/main      title, langs, shorts, assets, post, figma
      //   steps/<step>-<lang>   Path progress     waits/<tab>-<lang>   orange dots
      //   script/<lang>-<part>  script text       publish/<id>         one row per piece and platform
      // Nothing is hand-filled here. When a collection is empty the page says "not yet".
      let STORY = null,
        STEPDOCS = {},
        WAITS = [],
        SCRIPT = {},
        PUBROWS = []
      const COLS = ["story", "steps", "waits", "script", "publish"]
      const LOADED = {}
      let DATA = "loading" // loading | ready | off
      let SLOW = false
      const calm = (what) =>
        DATA === "off"
          ? "Story data is not available in this view. Open the page signed in to claude.ai."
          : DATA === "loading"
            ? SLOW
              ? "Story data cannot be reached yet. Still trying."
              : "Loading…"
            : what
      const KNOWN = ["path", "script", "cover", "long", "post", "pub", "shorts"]
      const isShort = (c) => c === "shorts" || !KNOWN.includes(c)
      const isVideo = (c) => c === "long" || isShort(c)
      const langs = () => {
        const l =
          STORY && Array.isArray(STORY.langs)
            ? STORY.langs.filter(
                (x) => typeof x === "string" && /^[a-z]{2,3}$/.test(x),
              )
            : []
        return l.length ? l : ["en"]
      }
      // Shorts of this story, in tab order: [{key: "refl", label: "Reflection"}, ...]
      const shorts = () =>
        STORY && Array.isArray(STORY.shorts)
          ? STORY.shorts.filter(
              (s) =>
                s &&
                typeof s.key === "string" &&
                /^[a-z][a-z0-9]{0,11}$/.test(s.key) &&
                !KNOWN.includes(s.key),
            )
          : []
      const shortLabel = (key) => {
        const i = shorts().findIndex((s) => s.key === key)
        return i < 0 ? "" : i + 1 + " · " + (shorts()[i].label || key)
      }
      const okSrc = (s) =>
        typeof s === "string" &&
        (/^https:\/\//.test(s) || /^[\w][\w./-]*$/.test(s)) &&
        !s.includes("..")
      const okUrl = (s) => typeof s === "string" && /^https:\/\//.test(s)
      // assets["<tab key>"]: {src, ver} for videos, {ver, A, B, C} for covers
      const asset = (l) => {
        const a = STORY && STORY.assets && STORY.assets[l]
        return a && typeof a === "object" ? a : null
      }
      const srcOf = (l) => {
        const a = asset(l)
        return a && okSrc(a.src) ? a.src : ""
      }
      const postOf = (g) => {
        const p = STORY && STORY.post && STORY.post[g]
        return p && typeof p === "object" && p.q ? p : null
      }
      const coversOf = (g) => {
        const a = asset("cover-" + g)
        if (!a) return null
        const list = COVERS.filter(([k]) => okSrc(a[k]))
        return list.length ? list.map(([k, n]) => [k, n, a[k]]) : null
      }
      const verOf = (l) => {
        const [c, g] = split(l)
        const a = asset(l),
          p = c === "post" ? postOf(g) : null
        return String((a && a.ver) || (p && p.ver) || "v1")
      }
      const waitTabs = (g) =>
        WAITS.filter((w) => w.lang === g && typeof w.tab === "string").map(
          (w) => w.tab,
        )
      // Kyiv wall clock -> Date (handles summer and winter time)
      function kyiv(date, time) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date || "")) return null
        const t = /^\d{2}:\d{2}$/.test(time || "") ? time : "00:00"
        const guess = new Date(date + "T" + t + ":00Z")
        if (isNaN(guess)) return null
        const parts = new Intl.DateTimeFormat("en-GB", {
          timeZone: "Europe/Kyiv",
          hourCycle: "h23",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        }).formatToParts(guess)
        const get = (k) => +parts.find((p) => p.type === k).value
        const asUTC = Date.UTC(
          get("year"),
          get("month") - 1,
          get("day"),
          get("hour"),
          get("minute"),
        )
        return new Date(guess.getTime() - (asUTC - guess.getTime()))
      }
      const whenText = (d) =>
        d.toLocaleString("en-GB", {
          weekday: "short",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          timeZone: "Europe/Kyiv",
        })
      const PUB_DONE = ["uploaded", "scheduled", "live"]
      const pubRows = (g) =>
        PUBROWS.filter((r) => String(r.lang || "").toLowerCase() === g).sort(
          (a, b) =>
            ((a.date || "9") + (a.time || "")).localeCompare(
              (b.date || "9") + (b.time || ""),
            ) || String(a.piece).localeCompare(String(b.piece)),
        )
      // Story path: the workflow of this devotional. Each step button opens its tab on this same page.
      const renderPath = (() => {
        const NS = "http://www.w3.org/2000/svg"
        // Pixel robot after the JF mark: wide red block with a slanted bottom edge, big eyes, stub arms, no legs.
        // Rows 0-1 are the hat (h), drawn in the step's tint, so every robot is its own character.
        const BODY = [
          "..rrrrrrrrrrrr..",
          "..rrrrrrrrrrrr..",
          "..rrwkrrrrwkrr..",
          ".rrrkkrrrrkkrrr.",
          ".rrrrrrrrrrrrrr.",
          "..rrrrrrrrrrrr..",
          "..ssrrrrrrrrrr..",
          ".....sssrrrrrr..",
          ".........sssrr..",
        ]
        const HATS = [
          ["....hhhhhhhh....", "..hhhhhhhhhhhh.."], // hard hat
          [".....hhhhhhh....", "....hhhhhhhhhhh."], // cap with a brim
          ["....hhhhhhhh....", "....hhhhhhhh...."], // beanie
          ["...h..h..h..h...", "...hhhhhhhhhh..."], // crown
          ["......hhhh......", "...hhhhhhhhhh..."], // beret
          ["................", "..hhhhhhhhhhhh.."], // headband
          [".......hh.......", "....hhhhhhhh...."], // bobble hat
          ["..hh........hh..", "..hhhhhhhhhhhh.."], // headphones
        ]
        function bot(i, tint, asleep, alive) {
          const svg = document.createElementNS(NS, "svg")
          svg.setAttribute("viewBox", "0 0 16 11")
          svg.setAttribute("shape-rendering", "crispEdges")
          svg.setAttribute("aria-hidden", "true")
          const col = asleep
            ? {
                r: "#4a3a33",
                s: "#3a2c27",
                k: "#15100e",
                w: "#6b5a50",
                f: "#3a2c27",
                h: "#5a4a42",
              }
            : {
                r: "#e2583a",
                s: "#a83e22",
                k: "#1a0f0d",
                w: "#ffffff",
                f: "#6b2a24",
                h: tint,
              }
          const eyes = []
          ;[...HATS[i % HATS.length], ...BODY].forEach((row, y) =>
            [...row].forEach((c, x) => {
              if (c === ".") return
              const r = document.createElementNS(NS, "rect")
              r.setAttribute("x", x)
              r.setAttribute("y", y)
              r.setAttribute("width", 1)
              r.setAttribute("height", 1)
              const eye = c === "k" || c === "w"
              r.setAttribute("fill", eye ? col.r : col[c])
              svg.appendChild(r)
              if (eye) {
                const e = r.cloneNode()
                e.setAttribute("fill", col[c])
                eyes.push(e)
              }
            }),
          )
          const g = document.createElementNS(NS, "g")
          g.setAttribute("class", "eyes" + (alive ? " alive" : ""))
          const lid = document.createElementNS(NS, "g")
          lid.setAttribute("class", "lid")
          eyes.forEach((e) => lid.appendChild(e))
          g.appendChild(lid)
          svg.appendChild(g)
          return svg
        }
        const I = (d) =>
          `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`
        const ICON = {
          doc: I(
            '<path d="M5.5 2.5h6l3.5 3.5v11.5h-9.5z"/><path d="M11.5 2.5v3.5h3.5M7.5 10h5M7.5 13h5"/>',
          ),
          image: I(
            '<rect x="2.5" y="4" width="15" height="12" rx="2"/><circle cx="7" cy="8.3" r="1.3"/><path d="M3 14.5l4.2-4 3 2.8 2.6-2.3 4.2 3.8"/>',
          ),
          play: I(
            '<rect x="2.5" y="4" width="15" height="12" rx="2"/><path d="M8.3 7.5v5l4.4-2.5z" fill="currentColor"/>',
          ),
          sched: I(
            '<rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8h14M7 2.5v3M13 2.5v3M7.3 12.6l1.9 1.9 3.5-3.6"/>',
          ),
          check: I('<path d="M4 10.5l4 4 8-9" stroke-width="2.2"/>'),
          chat: I(
            '<path d="M3 4.5h14v9.5H9l-4 3v-3H3z"/><path d="M7 8h6M7 10.8h4"/>',
          ),
          arrow: I(
            '<path d="M4 10h11M11 5.5L15.5 10 11 14.5" stroke-width="1.8"/>',
          ),
          clock: I(
            '<circle cx="10" cy="10" r="7"/><path d="M10 6v4.3l2.8 1.7"/>',
          ),
        }
        // id: the step id in the `steps` collection; tab: the tab its button opens
        const STEPS = [
          {
            id: "script",
            name: "Script",
            tint: "#4fc3a1",
            icon: "doc",
            tab: "script",
          },
          {
            id: "cover",
            name: "Covers",
            tint: "#e88aa8",
            icon: "image",
            tab: "cover",
          },
          {
            id: "long",
            name: "Long video",
            tint: "#a78bfa",
            icon: "play",
            tab: "long",
          },
          {
            id: "shorts",
            name: "Shorts",
            tint: "#f0975a",
            icon: "play",
            tab: "shorts",
          },
          {
            id: "post",
            name: "Community post",
            tint: "#efd08a",
            icon: "chat",
            tab: "post",
          },
          {
            id: "pub",
            name: "Publish",
            tint: "#5cc8d8",
            icon: "sched",
            tab: "pub",
          },
        ]
        const progress = (S, g) => {
          if (S.id === "pub") {
            const rows = pubRows(g)
            if (rows.length) {
              const d = rows.filter((r) => PUB_DONE.includes(r.status)).length
              const next = rows.find(
                (r) =>
                  r.status === "scheduled" && kyiv(r.date, r.time) > new Date(),
              )
              return [
                d,
                rows.length,
                next
                  ? "Next out: " + whenText(kyiv(next.date, next.time))
                  : d === rows.length
                    ? "All out"
                    : rows.length - d + " still to upload",
              ]
            } // scheduled counts as done
          }
          const s = STEPDOCS[S.id + "-" + g]
          if (!s) return [0, 0, calm("Not yet")]
          const t = Math.max(0, Math.floor(+s.total || 0)),
            d = Math.min(t, Math.max(0, Math.floor(+s.done || 0)))
          return [
            d,
            t,
            typeof s.line === "string" && s.line ? s.line : t ? "" : "Not yet",
          ]
        }
        // One entry per step: state is done | work | todo | wait
        const states = (g) => {
          const ws = WAITS.filter(
            (w) => w.lang === g && typeof w.tab === "string",
          )
          const p = STEPS.map((S) => progress(S, g))
          return STEPS.map((S, i) => {
            const [d, t, line] = p[i]
            const pct = t ? Math.round((100 * d) / t) : 0
            // waits docs for this step; the line then says what waits, e.g. "Your review: 2 · History"
            const mine = ws.filter((w) =>
              S.id === "shorts"
                ? isShort(w.tab) && w.tab !== "path"
                : w.tab === S.tab,
            )
            const waits = mine.length > 0
            const waitLine = waits
              ? "Your review: " +
                mine
                  .map(
                    (w) =>
                      (typeof w.what === "string" && w.what) ||
                      (S.id === "shorts" ? shortLabel(w.tab) : "") ||
                      S.name,
                  )
                  .join(", ")
              : ""
            const prevDone =
              i > 0 && p[i - 1][1] > 0 && p[i - 1][0] === p[i - 1][1]
            const state = waits
              ? "wait"
              : t > 0 && d === t
                ? "done"
                : d > 0 || prevDone
                  ? "work"
                  : "todo"
            return { S, pct, line: waits ? waitLine : line, state }
          })
        }
        const draw = (g, open) => {

        return li
      }
      function render() {
        if (LANG.startsWith("cover-"))
          COVERS.forEach(([k]) => {
            const ul = document.getElementById("clist" + k)
            if (!ul) return
            ul.textContent = ""
            notes
              .filter((n) => mine(n) && (n.cover || "A") === k)
              .sort((a, b) => (a.at || "").localeCompare(b.at || ""))
              .forEach((n) => {
                const li = item(n)
                li.querySelector(".chip").remove()
                ul.appendChild(li)
              })
          })
        const cur = notes.filter(mine).sort((a, b) => a.t - b.t)
        const old = notes
          .filter((n) => n.lang === LANG && n.ver !== VER)
          .sort(
            (a, b) =>
              (a.lang + a.ver).localeCompare(b.lang + b.ver) || a.t - b.t,
          )
        const list = $("list")
        list.textContent = ""
        if (!cur.length) {
          const li = document.createElement("li")
          li.className = "empty"
          li.style.display = "block"
          li.textContent = db
            ? "No notes yet. Pause the video, write what you see, and save."
            : "Loading notes…"
          list.appendChild(li)
        }
        cur.forEach((n) => list.appendChild(item(n)))
        $("listTitle").textContent =
          "Notes · " +
          LANG.toUpperCase() +
          (cur.length ? " (" + cur.length + ")" : "")
        $("olderBox").hidden = !old.length
        $("olderBtn").textContent = $("older").hidden
          ? "Show other notes (" + old.length + ")"
          : "Hide other notes"
        const o = $("older")
        o.textContent = ""
        old.forEach((n) => o.appendChild(item(n)))
        drawMarks()
      }
      $("olderBtn").onclick = () => {
        const o = $("older")
        o.hidden = !o.hidden
        render()
      }
      try {
        const d = localStorage.getItem("ph-draft")
        if (d) note.value = d
      } catch (e) {}
      note.addEventListener("input", () => {
        try {
          localStorage.setItem("ph-draft", note.value)
        } catch (e) {}
      })
      $("form").addEventListener("submit", async (e) => {
        e.preventDefault()
        const text = note.value.trim()
        if (!text) {
          say("Write the note first.", true)
          note.focus()
          return
        }
        if (!db) {
          say(
            "Notes cannot be saved in this view. Your text stays in the box.",
            true,
          )
          return
        }
        v.pause()
        const t = Math.round(v.currentTime * 10) / 10
        $("save").disabled = true
        say("Saving…")
        try {
          await db.collection("notes").add({
            t,
            text,
            lang: LANG,
            ver: VER,
            status: "open",
            reply: "",
            at: new Date().toISOString(),
          })
          note.value = ""
          try {
            localStorage.removeItem("ph-draft")
          } catch (e) {}
          say("Saved at " + fmt(t) + ".")
        } catch (err) {
          say("Could not save. Your text is still in the box, try again.", true)
        }
        $("save").disabled = false
      })
      refresh()
      ;(async () => {
        const d = await (window.claude && window.claude.use
          ? window.claude.use("dictation")
          : null)
        if (!d) return
        const mic = $("mic")
        mic.hidden = false
        let base = "",
          live = false,
          refused = false
        const show = (partial) => {
          note.value =
            base +
            (partial
              ? (base && !base.endsWith(" ") && !base.endsWith("\n")
                  ? " "
                  : "") + partial
              : "")
          try {
            localStorage.setItem("ph-draft", note.value)
          } catch (e) {}
        }
        d.onPartial(({ text }) => show(text))
        d.onFinal(({ text }) => {
          base = base + (base && !/[\s]$/.test(base) ? " " : "") + text
          show("")
        })
        d.onState(({ state: s, reason }) => {
          live = s === "listening" || s === "starting"
          mic.setAttribute("aria-pressed", live)
          mic.title = live ? "Stop dictation" : "Dictate"
          if (live) say("Listening…")
          else if (reason === "not_granted") {
            refused = true
            mic.hidden = true
            say("Dictation is off. You can type the note.")
          } else if (state.textContent === "Listening…") say("")
        })
        mic.onclick = () => {
          if (refused) return
          if (live) {
            d.stop().catch(() => {})
            return
          }
          v.pause()
          base = note.value
          d.start({ language: LANG.endsWith("ru") ? "ru" : "en" }).catch(
            (err) => {
              if (err && err.code === "not_granted") {
                refused = true
                mic.hidden = true
                say("Dictation is off. You can type the note.")
              } else if (err && err.code !== "dismissed")
                say("Dictation did not start. Try again or type.", true)
            },
          )
        }
      })()
      ;(async () => {
        db = await (window.claude && window.claude.use
          ? window.claude.use("db")
          : null)
        if (!db) {
          const l = $("list")
          l.textContent = ""
          const li = document.createElement("li")
          li.className = "empty"
          li.style.display = "block"
          li.textContent =
            "Notes are not available in this view. Open the page signed in to claude.ai."
          l.appendChild(li)
          DATA = "off"
          refresh()
          return
        }
        // Story data: one subscription per collection, kept for the life of the page.
        const slowData = setTimeout(() => {
          if (DATA === "loading") {
            SLOW = true
            refresh()
          }
        }, 10000)
        const loaded = (name) => {
          LOADED[name] = true
          if (DATA === "loading" && COLS.every((n) => LOADED[n])) {
            clearTimeout(slowData)
            DATA = "ready"
          }
          refresh()
        }
        const APPLY = {
          story: (docs) =>
            (STORY = docs.find((d) => d.id === "main") || docs[0] || null),
          steps: (docs) => {
            STEPDOCS = {}
            docs.forEach(
              (d) => (STEPDOCS[(d.step || "") + "-" + (d.lang || "")] = d),
            )
          },
          waits: (docs) => (WAITS = docs),
          script: (docs) => {
            SCRIPT = {}
            docs.forEach(
              (d) => (SCRIPT[(d.lang || "") + "-" + (d.part || "")] = d),
            )
          },
          publish: (docs) => (PUBROWS = docs),
        }
        COLS.forEach((name) =>
          db.collection(name).onSnapshot(
            (snap) => {
              APPLY[name](
                snap.docs.map((d) => Object.assign({}, d.data(), { id: d.id })),
              )
              loaded(name)
            },
            () => loaded(name),
          ),
        )
        const slow = setTimeout(() => {
          if (!notes.length) say("Notes cannot be reached yet. Still trying.")
        }, 10000)
        db.collection("notes").onSnapshot(
          (snap) => {
            clearTimeout(slow)
            notes = snap.docs.map((d) =>
              Object.assign(
                { id: d.id, t: 0, text: "", ver: VER, lang: "en" },
                d.data(),
              ),
            )
            render()
          },
          () => {
            clearTimeout(slow)
            say("Notes stopped loading. Reload the page.", true)
          },
        )
      })()
    </script>
  </body>
</html>
